[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cairn2"
version = "0.9.0"
description = "One versioned artifact repository, locally or over HTTP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["sqlalchemy>=2.0,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
all = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "itsdangerous>=2.2,<3",
    "psycopg[binary]>=3.2,<4",
    "boto3>=1.35,<2",
    "PyYAML>=6,<7",
    "markdown-it-py>=3,<5",
    "mdit-py-plugins>=0.4,<1",
    "nbclient>=0.10,<1",
    "nbformat>=5,<6",
    "ipykernel>=6,<8",
    "latex2mathml>=3.77,<4",
    "hydra-core>=1.3,<2",
    "numpy>=1.26",
    "Pillow>=10",
    "pyarrow>=16",
    "plotly>=5",
    "matplotlib>=3.8",
]
ui = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "itsdangerous>=2.2,<3"]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]
s3 = ["boto3>=1.35,<2"]
reports = ["PyYAML>=6,<7", "markdown-it-py>=3,<5", "mdit-py-plugins>=0.4,<1", "nbclient>=0.10,<1", "nbformat>=5,<6", "ipykernel>=6,<8", "latex2mathml>=3.77,<4", "hydra-core>=1.3,<2"]
media = ["numpy>=1.26", "Pillow>=10", "pyarrow>=16", "plotly>=5", "matplotlib>=3.8"]

[project.scripts]
cairn = "cairn.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["cairn"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "moto[s3,server]>=5,<6", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["postgres: requires CAIRN_TEST_POSTGRES_URL", "benchmark: explicit performance measurement"]

[tool.ruff]
line-length = 100
target-version = "py311"
