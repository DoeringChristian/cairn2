[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cairn2"
version = "0.17.1"
description = "Log runs, store artifacts, and find them again"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "protobuf>=4.21.12,<8"]

[project.optional-dependencies]
all = [
    "starlette>=0.41,<2",
    "uvicorn>=0.30,<1",
    "itsdangerous>=2.2,<3",
    "numpy>=1.26",
    "Pillow>=10",
    "plotly>=5",
    "matplotlib>=3.8",
]
server = ["starlette>=0.41,<2", "uvicorn>=0.30,<1"]
ui = ["starlette>=0.41,<2", "uvicorn>=0.30,<1", "itsdangerous>=2.2,<3"]
media = ["numpy>=1.26", "Pillow>=10", "plotly>=5", "matplotlib>=3.8"]

[project.scripts]
cairn = "cairn.__main__:main"
cairn-ui = "cairn_ui.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["cairn", "cairn_ui"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["cairn/cairn_pb2.py"]
